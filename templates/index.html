<html>
    <head>
        <title>Weatherberry</title>
        {% include "css.html" %}
    </head>
    <body>
        <div class="weather_block">
            DATE: {{ stats[0] }}<br />
            TEMP: {{ stats[1] }} F<br />
            PRESSURE: {{ stats[2] }} hPa<br />
            HUM: {{ stats[3] }} %<br />
        </div>
        <img
            src="{{url_for('static', filename='temp_plot.png')}}"
            alt="Temperature Graph"
        />
    </body>
</html>
